[Definition]
# Match failed auth attempts from 3proxy logs.
# Log format: L<date> <time> PROXY.<N> <code> <user> <client>:<port> ...
# Error codes 0000[4-7] indicate auth failure / forbidden.
failregex = (PROXY|SOCK[45])\.\d+ 0000[4-7] \S* <HOST>:\d+
ignoreregex =
datepattern = ^%%y-%%m-%%d %%H:%%M:%%S
