name: Deploy proxy-ch

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - lxc
          - host
          - dashboard

# ── Required secrets ──────────────────────────────────────────────────────────
# TAILSCALE_AUTHKEY   Tailscale ephemeral/reusable auth key
# SSH_PRIVATE_KEY     Ed25519 private key for root@pve-1 (Tailscale IP)
# PROXY_USERNAME      3proxy username
# PROXY_PASSWORD      3proxy password
# CF_TUNNEL_ID        Cloudflare Tunnel UUID
# PVE_TAILSCALE_IP    Tailscale IP of pve-1 (e.g. 100.120.45.107)
# LXC_ID              Proxmox container ID (e.g. 105)
# LXC_IP              LAN IP of the LXC container (e.g. 192.168.1.50)

concurrency:
  group: deploy-proxy-ch
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to pve-1 / CT ${{ vars.LXC_ID || '105' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Tailscale ───────────────────────────────────────────────────────────
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      # ── SSH key ─────────────────────────────────────────────────────────────
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat >> ~/.ssh/config <<EOF
          Host pve-1
            HostName ${{ secrets.PVE_TAILSCALE_IP }}
            User root
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            ServerAliveInterval 30
          EOF

      # ── Verify connectivity ─────────────────────────────────────────────────
      - name: Ping pve-1
        run: ssh pve-1 "hostname && uptime"

      # ── Copy config files to pve-1 ──────────────────────────────────────────
      - name: Upload configs to pve-1
        run: |
          ssh pve-1 "mkdir -p /tmp/deploy/{3proxy,nftables,fail2ban/filter.d,fail2ban/jail.d,cloudflared,dashboard,scripts}"
          rsync -az --delete \
            3proxy/ nftables/ fail2ban/ cloudflared/ dashboard/ scripts/ \
            pve-1:/tmp/deploy/ \
            --rsync-path="rsync"
          # Inject tunnel ID into cloudflared config on remote
          ssh pve-1 "sed -i 's/\${CF_TUNNEL_ID}/${{ secrets.CF_TUNNEL_ID }}/g' /tmp/deploy/cloudflared/proxy-ch.yml"

      # ── Deploy to LXC (CT 105) via pct exec ─────────────────────────────────
      - name: Deploy LXC – 3proxy + nftables + fail2ban
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'lxc' || github.event_name == 'push' }}
        run: |
          LXC_ID="${{ vars.LXC_ID || '105' }}"
          LXC_IP="${{ secrets.LXC_IP || '192.168.1.50' }}"

          # Sync files into LXC via pct push
          ssh pve-1 bash -s <<'ENDSSH'
          LXC_ID="${LXC_ID}"
          for dir in 3proxy nftables fail2ban/filter.d fail2ban/jail.d dashboard; do
            pct exec $LXC_ID -- mkdir -p /tmp/deploy/$dir
          done

          # Push each file
          for f in $(find /tmp/deploy -type f); do
            rel="${f#/tmp/deploy/}"
            pct push $LXC_ID "$f" "/tmp/deploy/$rel"
          done
          ENDSSH

          # Run setup inside LXC
          ssh pve-1 "pct exec $LXC_ID -- bash /tmp/deploy/scripts/setup-lxc.sh" \
            <<< "export PROXY_USERNAME='${{ secrets.PROXY_USERNAME }}'; export PROXY_PASSWORD='${{ secrets.PROXY_PASSWORD }}'"

      # Simpler alternative: exec with env vars
      - name: Apply 3proxy config & restart
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'lxc' || github.event_name == 'push' }}
        run: |
          LXC_ID="${{ vars.LXC_ID || '105' }}"
          ssh pve-1 <<ENDSSH
          pct exec $LXC_ID -- bash -c '
            cp /tmp/deploy/3proxy/3proxy.cfg /usr/local/3proxy/conf/3proxy.cfg
            echo "${{ secrets.PROXY_USERNAME }}:CL:${{ secrets.PROXY_PASSWORD }}" \
              > /usr/local/3proxy/conf/passwd
            chmod 600 /usr/local/3proxy/conf/passwd
            chown 3proxy:3proxy /usr/local/3proxy/conf/passwd
            systemctl reload 3proxy || systemctl restart 3proxy
            echo "3proxy: $(systemctl is-active 3proxy)"
          '
          ENDSSH

      # ── Deploy dashboard ────────────────────────────────────────────────────
      - name: Deploy dashboard
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'dashboard' || github.event_name == 'push' }}
        run: |
          LXC_ID="${{ vars.LXC_ID || '105' }}"
          ssh pve-1 <<ENDSSH
          pct exec $LXC_ID -- bash -c '
            mkdir -p /opt/proxy-dashboard
            cp /tmp/deploy/dashboard/dashboard.py /opt/proxy-dashboard/
            cp /tmp/deploy/dashboard/index.html   /opt/proxy-dashboard/
            cp /tmp/deploy/dashboard/requirements.txt /opt/proxy-dashboard/
            if [ ! -d /opt/proxy-dashboard/venv ]; then
              python3 -m venv /opt/proxy-dashboard/venv
            fi
            /opt/proxy-dashboard/venv/bin/pip install -q \
              -r /opt/proxy-dashboard/requirements.txt
            cp /tmp/deploy/dashboard/dashboard.service \
              /etc/systemd/system/proxy-dashboard.service
            systemctl daemon-reload
            systemctl enable --now proxy-dashboard
            systemctl restart proxy-dashboard
            echo "dashboard: $(systemctl is-active proxy-dashboard)"
          '
          ENDSSH

      # ── Deploy cloudflared on host ──────────────────────────────────────────
      - name: Deploy cloudflared (host)
        if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'host' || github.event_name == 'push' }}
        run: |
          ssh pve-1 <<ENDSSH
          # Update tunnel config (credentials-file must already exist from initial setup)
          cp /tmp/deploy/cloudflared/proxy-ch.yml /etc/cloudflared/proxy-ch.yml
          cp /tmp/deploy/cloudflared/cloudflared-proxy-ch.service \
             /etc/systemd/system/cloudflared-proxy-ch.service
          systemctl daemon-reload
          systemctl enable cloudflared-proxy-ch
          systemctl restart cloudflared-proxy-ch
          echo "cloudflared: $(systemctl is-active cloudflared-proxy-ch)"
          ENDSSH

      # ── Smoke test ──────────────────────────────────────────────────────────
      - name: Smoke test – verify CH egress IP
        run: |
          # Install cloudflared for the access tcp command
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared && chmod +x /usr/local/bin/cloudflared

          # Open tunnel in background
          cloudflared access tcp \
            --hostname proxy.rapold.io \
            --url localhost:18128 &
          CF_PID=$!
          sleep 5

          COUNTRY=$(curl -sf \
            -x "http://${{ secrets.PROXY_USERNAME }}:${{ secrets.PROXY_PASSWORD }}@localhost:18128" \
            https://ipinfo.io/country || echo "FAIL")

          kill $CF_PID 2>/dev/null || true

          echo "Egress country: $COUNTRY"
          if [ "$COUNTRY" != "CH" ]; then
            echo "❌ Expected CH, got: $COUNTRY"
            exit 1
          fi
          echo "✅ Swiss egress confirmed"

      # ── Summary ─────────────────────────────────────────────────────────────
      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Endpoint |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| HTTP Proxy | proxy.rapold.io:443 (via cloudflared) |" >> $GITHUB_STEP_SUMMARY
          echo "| SOCKS5 | socks.rapold.io:443 (via cloudflared) |" >> $GITHUB_STEP_SUMMARY
          echo "| Dashboard | https://dashboard.rapold.io |" >> $GITHUB_STEP_SUMMARY
          echo "| Egress | 213.3.19.53 · Zürich · CH |" >> $GITHUB_STEP_SUMMARY
