#!/usr/sbin/nft -f
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;

    # Allow established/related connections
    ct state established,related accept

    # Loopback
    iif lo accept

    # SSH from LAN only (adjust subnet if needed)
    ip saddr 192.168.1.0/24 tcp dport 22 accept

    # 3proxy: HTTP CONNECT and SOCKS5
    # Cloudflare Tunnel (cloudflared) connects from the LAN gateway
    tcp dport { 38128, 31080 } accept

    # Dashboard (accessed via Cloudflare Tunnel HTTP ingress)
    tcp dport 8080 accept

    # wstunnel WebSocket bridges (accessed via Cloudflare Tunnel HTTP ingress)
    # 8383 = HTTP CONNECT proxy bridge, 8384 = SOCKS5 bridge
    tcp dport { 8383, 8384 } accept

    # ICMP
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}
